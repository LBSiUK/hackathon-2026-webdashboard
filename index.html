<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lbsi.uk homepage</title>
    <link rel="icon" href="fav.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --gap-size: 10px;
            --tile-size: 100px;
            --grid-width: 600px;
            --grid-height: 400px;
            --grid-cols: 6;
            --grid-rows: 4;
        }
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            background-color: #050110; 
            color: white;
        }

        #silk-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        #main-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px; 
            box-sizing: border-box;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), var(--tile-size));
            grid-template-rows: repeat(var(--grid-rows), var(--tile-size));
            gap: var(--gap-size);
            width: var(--grid-width);
            height: var(--grid-height);
            box-sizing: border-box;
            transition: width 0.3s, height 0.3s;
        }

        .tile {
            position: relative;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: calc(var(--tile-size) * 0.1);
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tile:hover {
            transform: scale(1.03);
            z-index: 100;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            outline: 2px solid rgba(255,255,255,0.3);
        }

        .tile-label {
            font-size: calc(var(--tile-size) * 0.09);
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            line-height: 1.2;
            z-index: 2;
        }

        .tile-coord {
            position: absolute;
            top: calc(var(--tile-size) * 0.08);
            left: calc(var(--tile-size) * 0.08);
            font-size: calc(var(--tile-size) * 0.08);
            opacity: 0.4;
            font-family: monospace;
            z-index: 2;
        }

        .tile.source-hidden {
            background-image: none !important;
        }
        .tile.source-hidden > * {
            opacity: 0 !important;
        }

        .tile.content-tile {
            background-color: rgba(45, 43, 74, 0.85);
            cursor: default;
            display: block;
            padding: calc(var(--tile-size) * 0.15);
            overflow-y: auto;
        }
        
        .tile.content-tile:hover {
            transform: scale(1.01);
            outline: none;
        }
        .tile.content-tile:hover .rss-fade {
            bottom: -1px;
        }

        .tile.content-tile h2 {
            margin-top: 0;
            font-size: calc(var(--tile-size) * 0.2);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: calc(var(--tile-size) * 0.05);
            margin-bottom: calc(var(--tile-size) * 0.05);
            font-family: "Roman", serif;
        }

        .tile.content-tile p {
            font-size: calc(var(--tile-size) * 0.11);
            line-height: 1.4;
            margin-bottom: calc(var(--tile-size) * 0.1);
        }

        .tile.nav-tile, .tile.menu-tile {
            background-color: rgba(45, 43, 74, 0.85) !important;
            justify-content: flex-end; 
            align-items: flex-start;
        }

        .nav-arrow, .menu-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%; 
            height: 30%;
            object-fit: contain;
            opacity: 0.8;
        }
        
        .tile.clock-tile {
            justify-content: center;
            align-items: center;
            padding: 0;
            background-color: rgba(30, 60, 114, 0.85) !important;
        }
        
        .clock-time {
            font-size: calc(var(--tile-size) * 0.18);
            font-weight: 400;
            white-space: nowrap;
            width: 85%;
            text-align: center;
        }
        
        .clock-date {
            margin-top: calc(var(--tile-size) * 0.05);
            font-size: calc(var(--tile-size) * 0.1);
            font-weight: 300;
            opacity: 0.8;
            text-transform: capitalize;
        }

        .tile.content-tile::-webkit-scrollbar {
            width: 4px;
        }
        .tile.content-tile::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3); 
            border-radius: 2px;
        }

        .mic-tile {
            background-color: #d92b2b !important;
            color: white;
        }
        .mic-tile .menu-icon {
            filter: brightness(0) invert(1);
            width: 48%;
            height: 48%;
            opacity: 1;
        }
        .mic-tile .tile-label {
            color: white;
            font-weight: 600;
        }

        .app-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease; 
        }
        .app-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .animating-tile {
            position: fixed;
            z-index: 600;
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            transform-origin: center center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .animating-tile.flipped {
            transform: rotateY(180deg);
        }

        .tile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            top: 0;
            left: 0;
            overflow: hidden;
            box-sizing: border-box; 
        }

        .tile-front {
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        .tile-front.animate-shrink {
             transform: scale(0.8);
             opacity: 0.5;
        }

        .tile-back {
            transform: rotateY(180deg);
            background: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #444; 
        }

        .app-header {
            height: 40px;
            background: #101828;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .app-close-btn {
            width: 40px;
            height: 40px;
            background: #e81123;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .app-close-btn:hover {
            background: #f1707a;
        }

        .app-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <canvas id="silk-canvas"></canvas>
    <div id="app-backdrop" class="app-backdrop"></div>
    <div id="main-wrapper">
        <div id="grid-container"></div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('silk-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let time = 0;

            const waves = [
                { color: 'rgba(5, 1, 80, 0.4)', speed: 0.005, amplitude: 50, wavelength: 0.01, offset: 0 },
                { color: 'rgba(51, 0, 77, 0.3)', speed: 0.007, amplitude: 70, wavelength: 0.008, offset: 100 },
                { color: 'rgba(69, 43, 0, 0.2)', speed: 0.003, amplitude: 90, wavelength: 0.005, offset: 200 },
                { color: 'rgba(100, 50, 255, 0.15)', speed: 0.006, amplitude: 40, wavelength: 0.012, offset: 50 }
            ];

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            function draw() {
                ctx.fillStyle = '#050110';
                ctx.fillRect(0, 0, width, height);
                waves.forEach(wave => {
                    ctx.beginPath();
                    ctx.moveTo(0, height / 2);
                    for (let x = 0; x <= width; x += 10) {
                        const y = height / 2 + 
                                  Math.sin(x * wave.wavelength + time * wave.speed + wave.offset) * wave.amplitude +
                                  Math.sin(x * wave.wavelength * 0.5 + time * wave.speed * 0.5) * (wave.amplitude / 2);
                        ctx.lineTo(x, y);
                    }
                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                    ctx.closePath();
                    ctx.fillStyle = wave.color;
                    ctx.fill();
                    ctx.strokeStyle = wave.color.replace('0.4', '0.6').replace('0.3', '0.5');
                    ctx.lineWidth = 1;
                    ctx.stroke();
                });
                time += 1;
                requestAnimationFrame(draw);
            }
            window.addEventListener('resize', resize);
            resize();
            draw();
        })();
    </script>
    <script>
        function getRandomColor() {
            const colors = [
                '#da532c', '#2b5797', '#b91d47', '#99b433', '#00a300', 
                '#1e7145', '#ff0097', '#9f00a7', '#7e3878', '#603cba',
                '#00aba9', '#2d89ef', '#e3a21a', '#6d8764'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function parseCoordinate(coordStr) {
            const clean = coordStr.replace(/[{}]/g, '').trim();
            const parts = clean.split(',');
            const rowChar = parts[0].trim().toUpperCase();
            const colNum = parseInt(parts[1].trim());
            const rowNum = rowChar.charCodeAt(0) - 65; 
            return { r: rowNum, c: colNum };
        }

        function getOrdinalSuffix(day) {
            if (day > 3 && day < 21) return 'th';
            switch (day % 10) {
                case 1:  return "st";
                case 2:  return "nd";
                case 3:  return "rd";
                default: return "th";
            }
        }

        function updateClock(timeEl, dateEl) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeEl.textContent = `${hours}:${minutes}:${seconds}`;

            const monthNames = ["January", "February", "March", "April", "May", "June",
              "July", "August", "September", "October", "November", "December"
            ];
            const year = now.getFullYear();
            const month = monthNames[now.getMonth()];
            const day = now.getDate();
            dateEl.textContent = `${month} ${day}${getOrdinalSuffix(day)}` + `, ${year}`;
        }

        let allGridItems = [];

        function launchApp(sourceTile, url) {
            const backdrop = document.getElementById('app-backdrop');
            const rect = sourceTile.getBoundingClientRect();
            const container = document.createElement('div');
            container.className = 'animating-tile';
            container.style.top = rect.top + 'px';
            container.style.left = rect.left + 'px';
            container.style.width = rect.width + 'px';
            container.style.height = rect.height + 'px';
            const faceFront = document.createElement('div');
            faceFront.className = 'tile-face tile-front';
            const contentWrapper = document.createElement('div');
            contentWrapper.style.width = '100%';
            contentWrapper.style.height = '100%';
            contentWrapper.style.display = 'flex';
            contentWrapper.style.flexDirection = 'column';
            contentWrapper.style.justifyContent = 'flex-end';
            contentWrapper.innerHTML = sourceTile.innerHTML;
            
            faceFront.appendChild(contentWrapper);

            faceFront.style.backgroundColor = sourceTile.style.backgroundColor;
            faceFront.style.backgroundImage = sourceTile.style.backgroundImage;
            faceFront.style.backgroundSize = 'cover';
            faceFront.style.backgroundPosition = 'center';
            sourceTile.classList.forEach(cls => {
                if (cls !== 'tile') faceFront.classList.add(cls);
            });
            const compStyle = window.getComputedStyle(sourceTile);
            faceFront.style.padding = compStyle.padding;
            const faceBack = document.createElement('div');
            faceBack.className = 'tile-face tile-back';
            const header = document.createElement('div');
            header.className = 'app-header';
            const closeBtn = document.createElement('button');
            closeBtn.className = 'app-close-btn';
            closeBtn.innerHTML = '&#10005;';
            header.appendChild(closeBtn);
            const iframe = document.createElement('iframe');
            iframe.className = 'app-frame';
            iframe.src = url;

            faceBack.appendChild(header);
            faceBack.appendChild(iframe);

            container.appendChild(faceFront);
            container.appendChild(faceBack);
            document.body.appendChild(container);
            sourceTile.classList.add('source-hidden');
            container.offsetHeight;
            requestAnimationFrame(() => {
                backdrop.classList.add('active');
                container.classList.add('flipped');
                faceFront.classList.add('animate-shrink');
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const targetW = winW * 0.8;
                const targetH = winH * 0.8;
                
                container.style.top = ((winH - targetH) / 2) + 'px';
                container.style.left = ((winW - targetW) / 2) + 'px';
                container.style.width = targetW + 'px';
                container.style.height = targetH + 'px';
            });
            closeBtn.onclick = () => {
                backdrop.classList.remove('active');
                container.classList.remove('flipped');
                faceFront.classList.remove('animate-shrink');
                const currentRect = sourceTile.getBoundingClientRect();
                container.style.top = currentRect.top + 'px';
                container.style.left = currentRect.left + 'px';
                container.style.width = currentRect.width + 'px';
                container.style.height = currentRect.height + 'px';
                setTimeout(() => {
                    document.body.removeChild(container);
                    sourceTile.classList.remove('source-hidden');
                }, 800);
            };
        }

        function renderTiles() {
            if (allGridItems.length === 0) return;
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = ''; 

            const isPortrait = window.innerHeight > window.innerWidth;
            
            allGridItems.forEach(item => {
                const id = item.getAttribute('id');
                const label = item.getAttribute('label');
                const locString = item.getAttribute('locations');
                const type = item.getAttribute('type');
                const link = item.getAttribute('link'); 
                const image = item.getAttribute('image');
                
                const rawLocs = locString.split('},').map(s => s.includes('}') ? s : s + '}');
                let coords = rawLocs.map(parseCoordinate);
                if (isPortrait) {
                    coords = coords.map(c => {
                        if (c.r < 2) {
                            if (c.c < 3) return { r: c.r * 2, c: c.c };
                            return { r: c.r * 2 + 1, c: c.c - 3 };
                        }
                        if (c.c < 3) return { r: c.r + 2, c: c.c };
                        return { r: c.r + 4, c: c.c - 3 };
                    });
                }

                const minRow = Math.min(...coords.map(p => p.r));
                const maxRow = Math.max(...coords.map(p => p.r));
                const minCol = Math.min(...coords.map(p => p.c));
                const maxCol = Math.max(...coords.map(p => p.c));

                const rowStart = minRow + 1;
                const rowEnd = maxRow + 2;
                const colStart = minCol + 1;
                const colEnd = maxCol + 2;

                const tile = document.createElement('div');
                tile.className = 'tile';
                const bgColor = item.getAttribute('data-bg');
                if (bgColor) tile.style.backgroundColor = bgColor;
                const dataClass = item.getAttribute('data-class');
                if (dataClass) tile.classList.add(dataClass);
                tile.style.gridArea = `${rowStart} / ${colStart} / ${rowEnd} / ${colEnd}`;
                if (image) {
                    tile.style.backgroundImage = `url('${image}')`;
                    tile.style.backgroundSize = 'cover';
                    tile.style.backgroundPosition = 'center';
                }
                if ((id === "8" || id === "10" || id === "12") && link) {
                    tile.onclick = (e) => {
                        e.preventDefault();
                        launchApp(tile, link);
                    };
                    tile.title = label || "Launch App";
                    tile.style.cursor = "pointer";
                } 
                else if (link) {
                    tile.onclick = () => window.location.href = link;
                    tile.title = label || ""; 
                }

                if (type === 'content') {
                    tile.classList.add('content-tile');
                    tile.innerHTML = item.textContent.trim();
                    const scripts = tile.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        for (let i = 0; i < oldScript.attributes.length; i++) {
                            const attr = oldScript.attributes[i];
                            newScript.setAttribute(attr.name, attr.value);
                        }
                        if (oldScript.textContent) newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                    const rssEl = tile.querySelector('[data-rss-url]');
                    if (rssEl) {
                        const wrapper = document.createElement('div');
                        wrapper.style.display = 'flex';
                        wrapper.style.flexDirection = 'column';
                        wrapper.style.height = '100%';

                        const header = document.createElement('div');
                        header.style.cssText = 'flex:0 0 auto; display:flex; flex-direction:column; align-items:center; margin-bottom:8px; position:relative;';

                        const topRow = document.createElement('div');
                        topRow.style.cssText = 'width:100%; display:flex; justify-content:center; align-items:center; position:relative;';

                        const title = document.createElement('div');
                        title.textContent = label || 'News';
                        title.style.cssText = 'font-weight:600; font-size:2em;';

                        const refreshBtn = document.createElement('button');
                        refreshBtn.textContent = 'Refresh';
                        refreshBtn.style.cssText = 'position:absolute; right:0; top:0; cursor:pointer; font-size:2em;';

                        const lastUpdated = document.createElement('div');
                        lastUpdated.style.cssText = 'font-size:0.6em; opacity:0.85; text-align:center; margin-top:4px;';
                        lastUpdated.textContent = '';

                        topRow.appendChild(title);
                        topRow.appendChild(refreshBtn);
                        header.appendChild(topRow);
                        header.appendChild(lastUpdated);

                        const list = document.createElement('div');
                        list.style.flex = '1 1 auto';
                        list.style.minHeight = '0';
                        list.style.overflowY = 'auto';
                        list.style.paddingRight = '8px';
                        list.style.fontSize = '2em';

                        const listContainer = document.createElement('div');
                        listContainer.style.cssText = 'flex:1 1 auto; min-height:0; position:relative; display:flex; flex-direction:column;';
                        const rssFade = document.createElement('div');
                        rssFade.className = 'rss-fade';
                        rssFade.style.cssText = 'position:absolute; bottom:-1vh; left:0; right:0; height:80px; background:linear-gradient(to top, rgba(45,43,74,1), transparent); pointer-events:none;';
                        listContainer.appendChild(list);
                        listContainer.appendChild(rssFade);

                        wrapper.appendChild(header);
                        wrapper.appendChild(listContainer);

                        rssEl.parentNode.replaceChild(wrapper, rssEl);

                        const backendRss = 'http://localhost:5020/rss';
                        const backendLast = 'http://localhost:5020/rss/last_updated';

                        let lastUpdatedIso = 'never';
                        function formatLastUpdated(isoString) {
                            if (!isoString || isoString === 'never') return 'never';
                            const then = new Date(isoString);
                            const now = new Date();
                            const totalMins = Math.floor((now - then) / 60000);
                            if (totalMins < 0) return 'just now';
                            if (totalMins < 60) return totalMins + ' minute' + (totalMins === 1 ? '' : 's') + ' ago';
                            const hours = Math.floor(totalMins / 60);
                            const mins = totalMins % 60;
                            if (mins === 0) return hours + ' hour' + (hours === 1 ? '' : 's') + ' ago';
                            return hours + ' hour' + (hours === 1 ? '' : 's') + ' and ' + mins + ' minute' + (mins === 1 ? '' : 's') + ' ago';
                        }

                        const renderRSS = (str) => {
                            try {
                                const parser = new DOMParser();
                                const rss = parser.parseFromString(str, 'application/xml');
                                const items = Array.from(rss.querySelectorAll('item')).slice(0, 20);
                                list.innerHTML = '';
                                items.forEach(it => {
                                    const titleText = it.querySelector('title')?.textContent || 'No title';
                                    const link = it.querySelector('link')?.textContent || '#';
                                    const li = document.createElement('div');
                                    li.style.padding = '8px 0';
                                    li.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                                    const a = document.createElement('a');
                                    a.href = link.trim();
                                    a.textContent = titleText.trim();
                                    a.style.color = 'inherit';
                                    a.style.textDecoration = 'none';
                                    a.target = '_blank';
                                    li.appendChild(a);
                                    list.appendChild(li);
                                });
                            } catch (e) {
                                console.error('renderRSS parse error', e);
                                list.innerHTML = '<div>Could not parse RSS feed.</div>';
                            }
                        };

                        async function loadRss(force=false){
                            try{
                                const url = backendRss + (force ? '?force=true' : '');
                                const res = await fetch(url);
                                const txt = await res.text();
                                renderRSS(txt);
                                lastUpdatedIso = await fetch(backendLast).then(r=>r.text()).catch(()=> 'never');
                                lastUpdated.textContent = 'Last updated: ' + formatLastUpdated(lastUpdatedIso);
                            }catch(e){
                                console.error('RSS load error', e);
                                list.innerHTML = '<div>Could not load RSS feed.</div>';
                            }
                        }

                        refreshBtn.addEventListener('click', ()=> loadRss(true));
                        loadRss(false);
                        setInterval(() => {
                            lastUpdated.textContent = 'Last updated: ' + formatLastUpdated(lastUpdatedIso);
                        }, 60000);
                    }
                    const weatherEl = tile.querySelector('[data-weather]');
                    if (weatherEl) {
                        const backendWeather = 'http://localhost:5020/weather';
                        const lat = weatherEl.getAttribute('data-lat') || '50.8225';
                        const lon = weatherEl.getAttribute('data-lon') || '-0.1372';
                        const wrapper = document.createElement('div');
                        wrapper.className = 'weather-widget';
                        wrapper.style.cssText = 'display:flex;flex-direction:column;height:100%;overflow:hidden;';
                        const weatherStyle = document.createElement('style');
                        weatherStyle.textContent = '.weather-hourly-scroll{scrollbar-width:none;-ms-overflow-style:none;}.weather-hourly-scroll::-webkit-scrollbar{display:none;}';
                        wrapper.appendChild(weatherStyle);
                        const weatherCodeLabel = (code) => {
                            if (code === 0) return 'Clear';
                            if (code <= 3) return 'Cloudy';
                            if (code <= 49) return 'Fog';
                            if (code <= 67) return 'Rain';
                            if (code <= 77) return 'Snow';
                            if (code <= 82) return 'Showers';
                            if (code <= 99) return 'Storm';
                            return '';
                        };
                        const scrollSection = (titleText, isHourly) => {
                            const section = document.createElement('div');
                            section.style.cssText = 'flex:0 0 50%; min-height:0; display:flex; flex-direction:column; border-bottom:1px solid rgba(255,255,255,0.1);';
                            if (!isHourly) section.style.borderBottom = 'none';
                            const header = document.createElement('div');
                            header.style.cssText = 'flex:0 0 auto; padding:4px 0; font-weight:600; font-size:1.15em;';
                            header.textContent = titleText;
                            const scrollRow = document.createElement('div');
                            scrollRow.style.cssText = 'flex:1; display:flex; align-items:stretch; min-height:0; overflow:hidden;';
                            const leftArrowBtn = document.createElement('button');
                            leftArrowBtn.type = 'button';
                            leftArrowBtn.style.cssText = 'flex:0 0 48px; height:100%; min-height:60px; background:transparent; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; visibility:hidden;';
                            const leftArrowImg = document.createElement('img');
                            leftArrowImg.src = 'back.svg';
                            leftArrowImg.alt = 'Scroll back';
                            leftArrowImg.style.cssText = 'width:32px; height:32px; opacity:0.9;';
                            leftArrowBtn.appendChild(leftArrowImg);
                            leftArrowBtn.onclick = () => {
                                scrollArea.scrollLeft -= scrollArea.clientWidth * 0.85;
                            };
                            const scrollArea = document.createElement('div');
                            scrollArea.style.cssText = 'flex:1; overflow-x:auto; overflow-y:hidden; scroll-behavior:smooth; display:flex; gap:8px; padding:4px 0; align-items:center;';
                            if (isHourly) scrollArea.className = 'weather-hourly-scroll';
                            const updateScrollArrows = () => {
                                const atLeft = scrollArea.scrollLeft <= 10;
                                const atRight = scrollArea.scrollLeft + scrollArea.clientWidth >= scrollArea.scrollWidth - 10;
                                leftArrowBtn.style.visibility = atLeft ? 'hidden' : 'visible';
                                rightArrowBtn.style.visibility = atRight ? 'hidden' : 'visible';
                            };
                            scrollArea.addEventListener('scroll', updateScrollArrows);
                            const rightArrowBtn = document.createElement('button');
                            rightArrowBtn.type = 'button';
                            rightArrowBtn.style.cssText = 'flex:0 0 48px; height:100%; min-height:60px; background:transparent; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;';
                            const rightArrowImg = document.createElement('img');
                            rightArrowImg.src = 'right.svg';
                            rightArrowImg.alt = 'Scroll';
                            rightArrowImg.style.cssText = 'width:32px; height:32px; opacity:0.9;';
                            rightArrowBtn.appendChild(rightArrowImg);
                            rightArrowBtn.onclick = () => {
                                scrollArea.scrollLeft += scrollArea.clientWidth * 0.85;
                            };
                            scrollRow.appendChild(leftArrowBtn);
                            scrollRow.appendChild(scrollArea);
                            scrollRow.appendChild(rightArrowBtn);
                            section.appendChild(header);
                            section.appendChild(scrollRow);
                            wrapper.appendChild(section);
                            return { section, scrollArea, arrowBtn: rightArrowBtn, leftArrowBtn, updateScrollArrows };
                        };
                        let hourlyHeaderEl = null;
                        const scrollSectionWithHeader = (titleText, isHourly) => {
                            const out = scrollSection(titleText, isHourly);
                            if (isHourly) hourlyHeaderEl = out.section.querySelector('div');
                            return out;
                        };
                        const hourlySection = scrollSectionWithHeader('Next 24 hours', true);
                        const dailySection = scrollSection('2-week forecast', false);
                        const renderWeather = (data) => {
                            if (!data || !data.hourly) return;
                            const h = data.hourly;
                            const times = h.time || [];
                            const temps = h.temperature_2m || [];
                            const codes = h.weathercode || [];
                            const now = new Date();
                            let startIdx = 0;
                            for (let i = 0; i < times.length; i++) {
                                if (new Date(times[i]) >= now) { startIdx = i; break; }
                            }
                            const next24Indices = [];
                            for (let i = 0; i < 24 && startIdx + i < times.length; i++) next24Indices.push(startIdx + i);
                            if (hourlyHeaderEl) {
                                hourlyHeaderEl.textContent = 'Next 24 hours';
                            }
                            hourlySection.scrollArea.innerHTML = '';
                            for (const i of next24Indices) {
                                const card = document.createElement('div');
                                card.style.cssText = 'flex:0 0 auto; width:64px; text-align:center; padding:8px 6px; background:rgba(255,255,255,0.08); border-radius:6px;';
                                const timeStr = times[i].slice(11, 16);
                                card.innerHTML = `<div style="font-size:0.95em;opacity:0.8;">${timeStr}</div><div style="font-weight:600;font-size:1.15em;">${temps[i] != null ? Math.round(temps[i]) + '°' : '-'}</div><div style="font-size:0.9em;opacity:0.9;">${weatherCodeLabel(codes[i] || 0)}</div>`;
                                hourlySection.scrollArea.appendChild(card);
                            }
                            hourlySection.updateScrollArrows();
                            if (data.daily) {
                                const d = data.daily;
                                const days = d.time || [];
                                const minT = d.temperature_2m_min || [];
                                const maxT = d.temperature_2m_max || [];
                                const dCodes = d.weathercode || [];
                                dailySection.scrollArea.innerHTML = '';
                                const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                                for (let i = 0; i < days.length; i++) {
                                    const card = document.createElement('div');
                                    card.style.cssText = 'flex:0 0 auto; width:80px; text-align:center; padding:8px 6px; background:rgba(255,255,255,0.08); border-radius:6px;';
                                    const dDate = new Date(days[i]);
                                    const dayName = i === 0 ? 'Today' : dayNames[dDate.getDay()];
                                    card.innerHTML = `<div style="font-size:0.95em;opacity:0.8;">${dayName}</div><div style="font-weight:600;font-size:1.15em;">${maxT[i] != null ? Math.round(maxT[i]) + '°' : '-'}</div><div style="font-size:0.95em;">${minT[i] != null ? Math.round(minT[i]) + '°' : '-'}</div><div style="font-size:0.85em;opacity:0.9;">${weatherCodeLabel(dCodes[i] || 0)}</div>`;
                                    dailySection.scrollArea.appendChild(card);
                                }
                                dailySection.updateScrollArrows();
                            }
                        };
                        (async () => {
                            try {
                                const res = await fetch(backendWeather + '?lat=' + lat + '&lon=' + lon);
                                const data = await res.json();
                                renderWeather(data);
                            } catch (e) {
                                console.error('Weather load error', e);
                                hourlySection.scrollArea.innerHTML = '<div style="padding:8px;opacity:0.8;">Could not load weather.</div>';
                            }
                        })();
                        weatherEl.parentNode.replaceChild(wrapper, weatherEl);
                    }
                    if (!link) tile.onclick = null; 
                } else if (type === 'nav') {
                    tile.classList.add('nav-tile');
                    tile.innerHTML = `
                        <img src="back.svg" class="nav-arrow" alt="Back">
                        <span class="tile-label">Home page</span>
                    `;
                    tile.title = "Return Home";
                } else if (type === 'clock') {
                    tile.classList.add('clock-tile');
                    const timeSpan = document.createElement('div');
                    timeSpan.className = 'clock-time';
                    const dateSpan = document.createElement('div');
                    dateSpan.className = 'clock-date';
                    tile.appendChild(timeSpan);
                    tile.appendChild(dateSpan);
                    updateClock(timeSpan, dateSpan);
                    setInterval(() => updateClock(timeSpan, dateSpan), 1000);
                } else {
                    if (type === 'menu') {
                        tile.classList.add('menu-tile');
                        tile.innerHTML = `
                            <img src="images/link.png" class="menu-icon" alt="Link">
                            <span class="tile-label">${label}</span>
                        `;
                    } else {
                        if (!image) {
                            tile.style.backgroundColor = getRandomColor();
                        }
                        tile.innerHTML = `<span class="tile-label">${label}</span>`;
                    }
                }
                gridContainer.appendChild(tile);
            });
        }

        function parseLayoutConfig(xmlDoc) {
            const grid = xmlDoc && xmlDoc.querySelector('layout grid');
            if (!grid) return null;
            return {
                colsLandscape: parseInt(grid.getAttribute('cols_landscape'), 10) || 6,
                rowsLandscape: parseInt(grid.getAttribute('rows_landscape'), 10) || 4,
                colsPortrait: parseInt(grid.getAttribute('cols_portrait'), 10) || 3,
                rowsPortrait: parseInt(grid.getAttribute('rows_portrait'), 10) || 8,
                gap: parseInt(grid.getAttribute('gap'), 10) || 10,
                padding: parseInt(grid.getAttribute('padding'), 10) || 40
            };
        }

        function resizeGrid(layoutConfig) {
            const config = layoutConfig || {
                colsLandscape: 6, rowsLandscape: 4, colsPortrait: 3, rowsPortrait: 8, gap: 10, padding: 40
            };
            const availableHeight = window.innerHeight;
            const availableWidth = window.innerWidth;
            const isPortrait = availableHeight > availableWidth;
            const cols = isPortrait ? config.colsPortrait : config.colsLandscape;
            const rows = isPortrait ? config.rowsPortrait : config.rowsLandscape;
            const gap = config.gap;
            const padding = config.padding;

            const root = document.documentElement;
            root.style.setProperty('--grid-cols', cols);
            root.style.setProperty('--grid-rows', rows);
            root.style.setProperty('--gap-size', `${gap}px`);

            const maxTileW = (availableWidth - (gap * (cols - 1)) - padding) / cols;
            const maxTileH = (availableHeight - (gap * (rows - 1)) - padding) / rows;
            const tileSize = Math.floor(Math.min(maxTileW, maxTileH));

            const gridW = (tileSize * cols) + (gap * (cols - 1));
            const gridH = (tileSize * rows) + (gap * (rows - 1));

            root.style.setProperty('--tile-size', `${tileSize}px`);
            root.style.setProperty('--grid-width', `${gridW}px`);
            root.style.setProperty('--grid-height', `${gridH}px`);

            renderTiles();
        }

        let layoutConfig = null;

        document.addEventListener('DOMContentLoaded', () => {
            const parser = new DOMParser();
            const gridFiles = ['grid_part1.xml', 'grid_part2.xml', 'grid_part3.xml', 'grid_part4.xml'];

            Promise.all(gridFiles.map(url => fetch(url).then(res => res.text())))
                .then(contents => {
                    allGridItems = [];
                    contents.forEach((xmlContent, i) => {
                        const xmlDoc = parser.parseFromString(xmlContent, 'text/xml');
                        const items = Array.from(xmlDoc.getElementsByTagName('item'));
                        allGridItems = allGridItems.concat(items);
                        if (i === 2) layoutConfig = parseLayoutConfig(xmlDoc);
                    });
                    resizeGrid(layoutConfig);
                })
                .catch(err => console.error('Error loading grid files:', err));

            window.addEventListener('resize', () => resizeGrid(layoutConfig));
        });
    </script>
    <script src="https://kit.fontawesome.com/94691f149b.js" crossorigin="anonymous"></script>
